apply plugin: 'com.android.application'

android {
    namespace 'com.childpet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.childpet.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            // 固定签名：保证每次构建签名一致，APK 可直接覆盖安装（无需卸载）
            storeFile file("../keystore/release.keystore")
            storePassword "petpaw2026"
            keyAlias "petpaw"
            keyPassword "petpaw2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
