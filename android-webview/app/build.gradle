apply plugin: 'com.android.application'

android {
    namespace 'com.childpet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.childpet.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug 签名即可直接安装，无需自己生成 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
