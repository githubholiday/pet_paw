name: Build Offline APK (WebView)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-offline-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (use runner's preinstalled SDK)
        run: |
          # ubuntu 镜像自带 Android SDK，ANDROID_SDK_ROOT 已由 runner 预设且不可被 $GITHUB_ENV 覆盖。
          # 正确做法：直接使用它，并把 ANDROID_HOME 设成相等，从根上消除"两套 SDK 路径冲突"。
          echo "Runner ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: /opt/gradle
          key: gradle-dist-8.6

      - name: Install Gradle 8.6 (with retry)
        run: |
          if [ ! -x /opt/gradle/gradle-8.6/bin/gradle ]; then
            for i in 1 2 3 4; do
              wget -q --tries=3 --timeout=180 --retry-connrefused \
                https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip && break
              echo "下载 gradle 失败，重试 $i/4"; sleep 8
            done
            mkdir -p /opt/gradle
            unzip -q /tmp/gradle.zip -d /opt/gradle
          fi
          echo "/opt/gradle/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Ensure fixed signing keystore (always regenerate)
        run: |
          mkdir -p android-webview/keystore
          rm -f android-webview/keystore/release.keystore
          keytool -genkeypair -v \
            -keystore android-webview/keystore/release.keystore -storetype PKCS12 \
            -alias petpaw -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass petpaw2026 -keypass petpaw2026 \
            -dname "CN=PetPaw, OU=Family, O=PetPaw, L=Home, S=Home, C=CN"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('android-webview/**/*.gradle') }}
          restore-keys: gradle-caches-

      - name: Diagnostics
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          gradle --version

      - name: Build release APK
        working-directory: android-webview
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: child-pet-offline-apk
          path: android-webview/app/build/outputs/apk/release/*.apk
