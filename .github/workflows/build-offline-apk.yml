name: Build Offline APK (WebView)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-offline-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache signing keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android-webview/keystore/release.keystore
          key: petpaw-keystore-v1

      - name: Ensure fixed signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android-webview/keystore
          keytool -genkeypair -v \
            -keystore android-webview/keystore/release.keystore -storetype PKCS12 \
            -alias petpaw -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass petpaw2026 -keypass petpaw2026 \
            -dname "CN=PetPaw, OU=Family, O=PetPaw, L=Home, S=Home, C=CN"
          echo "已生成固定签名 keystore（已缓存，后续复用同一签名）"

      - name: Install Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          mkdir -p /opt/gradle
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate gradle wrapper
        working-directory: android-webview
        run: gradle wrapper --gradle-version 8.6

      - name: Build release APK
        working-directory: android-webview
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: child-pet-offline-apk
          path: android-webview/app/build/outputs/apk/release/*.apk
